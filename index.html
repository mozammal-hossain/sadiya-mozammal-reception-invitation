<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadiya &amp; Mozammal — Reception Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-blue: #2c4a63;
    --mid-blue: #6d93ad;
    --pale-blue: #eaf2f6;
    --pale-blue-2: #dceaf0;
    --accent: #a9c9d9;
    --text: #34495a;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(180deg, var(--pale-blue) 0%, var(--pale-blue-2) 100%);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page {
    width: 100%;
    max-width: 640px;
    padding: 1.25rem;
  }

  .embed-wrap {
    position: relative;
    width: 100%;
    height: 0;
    padding-top: 140.9524%;
    padding-bottom: 0;
    box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16);
    margin-top: 1.6em;
    margin-bottom: 2.6em;
    overflow: hidden;
    border-radius: 8px;
    will-change: transform;
  }

  .embed-wrap iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    border: none;
    padding: 0;
    margin: 0;
  }

  .rsvp-section {
    background: var(--white);
    border-radius: 16px;
    padding: 2.25rem 1.75rem 2rem;
    box-shadow: 0 4px 20px rgba(44, 74, 99, 0.12);
    border: 1px solid var(--accent);
    text-align: center;
    margin-bottom: 3rem;
  }

  .rsvp-section h2 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: 2.6rem;
    color: var(--deep-blue);
    margin: 0 0 0.25rem;
  }

  .rsvp-section .subheading {
    font-size: 1.15rem;
    color: var(--mid-blue);
    margin: 0 0 1.75rem;
    line-height: 1.5;
  }

  .rsvp-form {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    text-align: left;
  }

  .field label {
    display: block;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--deep-blue);
    margin-bottom: 0.4rem;
  }

  .field input[type="text"] {
    width: 100%;
    padding: 0.7rem 0.9rem;
    font-family: inherit;
    font-size: 1.1rem;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--pale-blue);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input[type="text"]:focus {
    border-color: var(--mid-blue);
    box-shadow: 0 0 0 3px rgba(109, 147, 173, 0.25);
  }

  .toggle-group {
    display: flex;
    gap: 0.75rem;
  }

  .toggle-option {
    flex: 1;
    display: flex;
  }

  .toggle-option input[type="radio"] {
    display: none;
  }

  .toggle-option label {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0.65rem 0.5rem;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--mid-blue);
    background: var(--pale-blue);
    border: 1px solid var(--accent);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }

  .toggle-option input[type="radio"]:checked + label {
    background: var(--deep-blue);
    border-color: var(--deep-blue);
    color: var(--white);
  }

  .rsvp-submit {
    margin-top: 0.5rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.9rem 1.5rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--white);
    background: linear-gradient(135deg, var(--mid-blue), var(--deep-blue));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(44, 74, 99, 0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .rsvp-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(44, 74, 99, 0.38);
  }

  .rsvp-submit:active {
    transform: translateY(0);
  }

  .rsvp-submit svg {
    width: 1.25rem;
    height: 1.25rem;
    flex-shrink: 0;
  }

  .field-error {
    font-size: 0.95rem;
    color: #b3413e;
    margin-top: 0.35rem;
    display: none;
  }

  .field-error.visible {
    display: block;
  }
</style>
</head>
<body>
<div class="page">

  <div class="embed-wrap">
    <iframe loading="lazy" src="https://www.canva.com/design/DAHSs1ymTbo/n-S3_PLb4Aq-JGjXMXYGWQ/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
  </div>

  <section class="rsvp-section">
    <h2>Will You Be Joining Us?</h2>
    <p class="subheading">Please let us know if you'll be celebrating with us — just fill in your details and send it our way on WhatsApp.</p>

    <form class="rsvp-form" id="rsvpForm">
      <div class="field">
        <label for="guestName">Your Name</label>
        <input type="text" id="guestName" name="guestName" placeholder="Enter your full name" autocomplete="name">
        <div class="field-error" id="nameError">Please enter your name.</div>
      </div>

      <div class="field">
        <label>Attending?</label>
        <div class="toggle-group">
          <div class="toggle-option">
            <input type="radio" id="attendingYes" name="attending" value="yes" checked>
            <label for="attendingYes">Yes, I'll be there</label>
          </div>
          <div class="toggle-option">
            <input type="radio" id="attendingNo" name="attending" value="no">
            <label for="attendingNo">Sorry, can't make it</label>
          </div>
        </div>
      </div>

      <button type="submit" class="rsvp-submit">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 2C6.485 2 2.002 6.483 2.002 12c0 1.936.542 3.816 1.567 5.457L2 22l4.65-1.55A9.958 9.958 0 0 0 12.004 22C17.522 22 22 17.517 22 12S17.522 2 12.004 2zm0 18.182c-1.752 0-3.462-.47-4.958-1.36l-.355-.21-2.76.92.928-2.69-.23-.368A8.166 8.166 0 0 1 3.82 12c0-4.51 3.672-8.182 8.184-8.182 4.51 0 8.182 3.671 8.182 8.182 0 4.511-3.671 8.182-8.182 8.182z"/></svg>
        Send RSVP via WhatsApp
      </button>
    </form>
  </section>

</div>

<script>
  var WHATSAPP_NUMBER = "8801722015295";

  document.getElementById('rsvpForm').addEventListener('submit', function (e) {
    e.preventDefault();

    var nameInput = document.getElementById('guestName');
    var nameError = document.getElementById('nameError');
    var name = nameInput.value.trim();

    if (!name) {
      nameError.classList.add('visible');
      nameInput.focus();
      return;
    }
    nameError.classList.remove('visible');

    var attending = document.querySelector('input[name="attending"]:checked').value;
    var attendingText = attending === 'yes' ? 'will be attending' : 'will not be able to attend';

    var message = 'Hi! This is ' + name + '. I ' + attendingText + ' the wedding reception.';
    var url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(message);

    window.open(url, '_blank', 'noopener');
  });
</script>

</body>
</html>
